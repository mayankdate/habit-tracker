<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habits</title>
<style>
:root { color-scheme: dark; --bg:#0b0e14; --card:#141924; --line:#222a39; --muted:#8b93a7; --dim:#5a6274; --text:#e6e9ef; --empty:#232a39; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(1200px 600px at 20% -10%, #15203a 0%, var(--bg) 55%) var(--bg);
  color: var(--text); min-height: 100vh; padding: 32px 16px 60px;
}
.wrap { max-width: 1040px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; }
h1 { font-size: 1.9rem; letter-spacing: -.02em; }
h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
.muted { color: var(--muted); font-size: .8rem; }
section { margin-top: 28px; }
.banner { background: #3a1d1d; border: 1px solid #6b2a2a; border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: .9rem; line-height: 1.5; white-space: pre-wrap; }

/* challenges */
.chal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
.chal-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.chal-name { font-weight: 600; font-size: 1.05rem; }
.chal-score { font-size: 1.6rem; font-weight: 700; }
.pbar { height: 8px; border-radius: 99px; background: #1b2130; overflow: hidden; margin-top: 10px; }
.pfill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff6b4a, #ffd23f, #4ade80); }
.pmeta { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: .8rem; }
.pmeta b { color: var(--text); }

/* check-in */
.checkin { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.daynav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.daynav button, .tool { background: #1b2130; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
.daynav button:disabled { opacity: .35; cursor: default; }
.daylabel { font-weight: 600; min-width: 150px; text-align: center; }
.daynav input[type=date] { background: #1b2130; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: .85rem; }
.toggles { display: flex; flex-wrap: wrap; gap: 10px; }
.toggle { flex: 1 1 140px; display: flex; align-items: center; gap: 10px; background: #10141d; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--text); font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer; text-align: left; }
.toggle .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--c); flex: none; display: grid; place-items: center; font-size: .8rem; color: #0b0e14; }
.toggle.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, #10141d); }
.toggle.on .box { background: var(--c); }
.note { width: 100%; margin-top: 12px; background: #10141d; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: inherit; font-size: .9rem; }

/* habits */
.hrow { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; padding: 22px 0; border-top: 1px solid #1c2330; }
.hinfo { width: 280px; flex: none; position: relative; padding-left: 14px; }
.hinfo::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; border-radius: 3px; background: var(--c); }
.hname { font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.star { color: var(--c); font-size: .8rem; }
.chip { font-size: .66rem; color: var(--muted); border: 1px solid #2a3344; border-radius: 99px; padding: 1px 8px; font-weight: 500; }
.chip.first { margin-left: auto; }
.hbig { font-size: 2.6rem; font-weight: 700; color: var(--c); line-height: 1; margin: 12px 0 2px; }
.hbig .u { font-size: .72rem; font-weight: 500; color: var(--muted); margin-left: 7px; }
.periods { margin-top: 10px; display: grid; gap: 7px; }
.period { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .78rem; color: var(--muted); }
.period b { color: var(--text); }
.period .bar { grid-column: 1 / -1; height: 4px; border-radius: 99px; background: #1b2130; overflow: hidden; }
.period .bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.streaks { margin-top: 12px; font-size: .78rem; color: var(--muted); line-height: 1.6; }
.streaks b { color: var(--text); }
.hcals { display: flex; gap: 20px; flex-wrap: wrap; flex: 1; min-width: 0; }
.mcal .mlabel { font-size: .68rem; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .07em; }
.mgrid { display: grid; grid-template-columns: repeat(7, 15px); gap: 3px; }
.mc { width: 15px; height: 15px; border-radius: 3px; background: var(--empty); border: 0; padding: 0; cursor: pointer; }
.mc.on { background: var(--c); }
.mc.out { background: transparent; border: 1px dashed #2a3344; cursor: default; }
.mc.future { background: transparent; border: 1px dashed #2a3344; cursor: default; }
.mc.sel { box-shadow: 0 0 0 2px var(--text); }
.ended { opacity: .6; }

.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 36px; padding-top: 18px; border-top: 1px solid #1c2330; }
.tools .muted { flex: 1 1 260px; }
.sync-ok { color: #4ade80; } .sync-bad { color: #ff8a7a; }
@media (max-width: 560px) { .hinfo { width: 100%; } h1 { font-size: 1.5rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Habits</h1>
    <span class="muted" id="today"></span>
  </header>
  <div id="errors"></div>
  <section id="challenges"></section>
  <section>
    <h2>Check in</h2>
    <div class="checkin">
      <div class="daynav">
        <button id="prev" title="Previous day">‹</button>
        <span class="daylabel" id="daylabel"></span>
        <button id="next" title="Next day">›</button>
        <button id="gotoday">Today</button>
        <input type="date" id="picker" aria-label="Pick a day">
      </div>
      <div class="toggles" id="toggles"></div>
      <input class="note" id="note" placeholder="Note for this day (optional)">
    </div>
  </section>
  <section>
    <h2>Habits</h2>
    <div id="habits"></div>
  </section>
  <div class="tools">
    <span class="muted" id="syncmsg"></span>
    <button class="tool" id="connect">Connect GitHub</button>
  </div>
  <div class="checkin" id="connectbox" hidden style="margin-top:12px">
    <p class="muted" style="line-height:1.6;margin-bottom:10px">Paste a GitHub key so this browser can save your ticks to <b id="csvpath"></b>.
    Make one at <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:#8ab4ff">github.com → Fine-grained token</a>:
    Repository access = only <b id="reponame"></b>, Permissions → Contents = Read and write. Each browser (PC, phone) needs it once.</p>
    <input class="note" id="token" type="password" placeholder="github_pat_…" autocomplete="off" style="margin-top:0">
    <div style="display:flex;gap:10px;margin-top:10px"><button class="tool" id="savetoken">Save key</button><button class="tool" id="forget">Forget key</button></div>
  </div>
</div>
<script src="vendor/js-yaml.min.js"></script>
<script>
"use strict";
// ---------- dates as whole day numbers (UTC-based, no time zone drift) ----------
const MS = 86400000;
const toNum = iso => { const [y, m, d] = iso.split("-").map(Number); return Date.UTC(y, m - 1, d) / MS; };
const toIso = n => new Date(n * MS).toISOString().slice(0, 10);
const weekday = n => (new Date(n * MS).getUTCDay() + 6) % 7; // Monday = 0
const monday = n => n - weekday(n);
const now = new Date();
const TODAY = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / MS;
const fmt = (n, opts) => new Date(n * MS).toLocaleDateString(undefined, { timeZone: "UTC", ...opts });
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PALETTE = ["#ff6b4a", "#ffd23f", "#4ade80", "#f472b6", "#a78bfa", "#38bdf8", "#fb923c", "#2dd4bf"];
const PENDING_KEY = "habit-tracker-pending";
const TOKEN_KEY = "habit-tracker-github-key";

// remote = what checkins.csv holds; local = ticks changed here and not yet saved to GitHub
let config, habits = [], challenges = [], remote = {}, remoteColumns = [], remoteSha = null, local = {}, selected = TODAY;

// ---------- config ----------
function dateField(value, where, errors, required) {
  if (value === undefined || value === null || value === "") {
    if (required) errors.push(`${where}: needs a date like 2026-10-01`);
    return null;
  }
  const s = String(value).trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) { errors.push(`${where}: "${s}" is not a date like 2026-10-01`); return null; }
  return toNum(s);
}

function parseGoal(goal, where, errors) {
  const s = String(goal ?? "daily").trim().toLowerCase();
  if (s === "daily" || s === "every day") return 7;
  const m = s.match(/^(\d+)\s*(?:per|\/|x|a|times a|times per|days a|days per)?\s*week$/) || s.match(/^(\d+)$/);
  if (m && +m[1] >= 1 && +m[1] <= 7) return +m[1];
  errors.push(`${where}: goal "${goal}" should be "daily" or like "5 per week"`);
  return 7;
}

function loadConfig(text) {
  const errors = [];
  let raw;
  try { raw = jsyaml.load(text, { schema: jsyaml.CORE_SCHEMA }) || {}; }
  catch (e) { return { errors: ["habits.yaml could not be read: " + e.message] }; }
  const names = new Set();
  const hs = (raw.habits || []).map((h, i) => {
    const where = `Habit ${h && h.name ? '"' + h.name + '"' : "#" + (i + 1)}`;
    if (!h || !h.name) { errors.push(`${where}: needs a name`); return null; }
    const name = String(h.name);
    if (names.has(name)) errors.push(`${where}: listed twice`);
    names.add(name);
    const start = dateField(h.start, where + " start", errors, true);
    const end = dateField(h.end, where + " end", errors, false);
    if (start == null) return null;
    if (end != null && end < start) errors.push(`${where}: end is before start`);
    return { name, start, end, perWeek: parseGoal(h.goal, where, errors),
             color: h.color ? String(h.color) : PALETTE[i % PALETTE.length], star: h.star === true || h.star === "true" };
  }).filter(Boolean);
  const cs = (raw.challenges || []).map((c, i) => {
    const where = `Challenge ${c && c.name ? '"' + c.name + '"' : "#" + (i + 1)}`;
    if (!c) return null;
    const start = dateField(c.start, where + " start", errors, true);
    const end = dateField(c.end, where + " end", errors, true);
    if (start == null || end == null) return null;
    if (end < start) { errors.push(`${where}: end is before start`); return null; }
    const list = c.habits ? c.habits.map(String) : null;
    (list || []).forEach(n => { if (!names.has(n)) errors.push(`${where}: no habit called "${n}"`); });
    return { name: String(c.name || "Challenge " + (i + 1)), start, end, habits: list };
  }).filter(Boolean);
  if (!hs.length) errors.push("habits.yaml has no habits yet.");
  const gh = raw.github || {};
  const github = gh.repo ? { repo: String(gh.repo), branch: String(gh.branch || "main"), file: String(gh.file || "docs/checkins.csv") } : null;
  if (!github) errors.push("habits.yaml has no github: section, so ticks can only be kept in this browser.");
  return { title: raw.title ? String(raw.title) : "Habits", habits: hs, challenges: cs, github, errors };
}

// ---------- check-in data (CSV: date, one column per habit with 1 = done, note) ----------
function parseCsv(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const [head = [], ...body] = rows.filter(r => r.some(x => x.trim()));
  const cols = head.map(h => h.trim());
  const days = {};
  for (const r of body) {
    const date = (r[0] || "").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    const rec = { done: [] };
    cols.forEach((c, i) => {
      const v = (r[i] || "").trim();
      if (i === 0 || !v) return;
      if (c.toLowerCase() === "note") rec.note = v;
      else if (!/^(0|no|false|n)$/i.test(v)) rec.done.push(c);
    });
    days[date] = rec;
  }
  return { days, columns: cols.slice(1).filter(c => c.toLowerCase() !== "note") };
}

function toCsv(days) {
  // habits from habits.yaml first, then any older columns, so nothing is ever dropped
  const cols = [...new Set([...habits.map(h => h.name), ...remoteColumns, ...Object.values(days).flatMap(d => d.done || [])])];
  const cell = v => /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [["date", ...cols, "note"].map(cell).join(",")];
  for (const date of Object.keys(days).sort()) {
    const d = days[date];
    if (!(d.done || []).length && !d.note) continue;
    lines.push([date, ...cols.map(c => (d.done || []).includes(c) ? "1" : ""), cell(d.note || "")].join(","));
  }
  return lines.join("\n") + "\n";
}

const b64encode = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64decode = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; } };
const apiUrl = () => `https://api.github.com/repos/${config.github.repo}/contents/${config.github.file.split("/").map(encodeURIComponent).join("/")}`;
function apiHeaders() {
  const h = { Accept: "application/vnd.github+json" };
  const t = getToken(); if (t) h.Authorization = "Bearer " + t;
  return h;
}

async function loadRemote() {
  let text = null;
  if (config.github) {
    try {
      const r = await fetch(apiUrl() + "?ref=" + encodeURIComponent(config.github.branch) + "&t=" + Date.now(), { headers: apiHeaders(), cache: "no-store" });
      if (r.ok) { const j = await r.json(); remoteSha = j.sha; text = b64decode(j.content); }
      else if (r.status === 404) { remoteSha = null; text = ""; }
    } catch { /* fall back to the copy published next to the page */ }
  }
  if (text === null) {
    const r = await fetch("checkins.csv", { cache: "no-store" }).catch(() => null);
    text = r && r.ok ? await r.text() : "";
  }
  const parsed = parseCsv(text);
  remote = parsed.days; remoteColumns = parsed.columns;
}

function readLocal() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "{}"); } catch { return {}; }
}
function writeLocal() {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(local)); } catch { /* still saved to GitHub below */ }
}

let saveTimer = null, saving = false;
function setSync(text, kind) {
  const el = document.getElementById("syncmsg");
  el.textContent = text; el.className = "muted" + (kind ? " sync-" + kind : "");
}
function syncStatus() {
  const n = Object.keys(local).length;
  if (!config.github) return setSync("Ticks are kept in this browser only.", n ? "bad" : "");
  if (!getToken()) return setSync(n ? `${n} day${n === 1 ? "" : "s"} not saved yet: connect GitHub to save.` : "Connect GitHub on this browser to save ticks.", n ? "bad" : "");
  if (!n) return setSync("All ticks saved to GitHub.", "ok");
}
function scheduleSave() {
  clearTimeout(saveTimer);
  if (config.github && getToken()) { setSync("Saving…"); saveTimer = setTimeout(save, 1200); }
  else syncStatus();
}
async function save(retry = true) {
  if (saving) { saveTimer = setTimeout(save, 800); return; }
  const pending = { ...local };
  if (!Object.keys(pending).length) return syncStatus();
  saving = true;
  try {
    const merged = { ...remote, ...pending };
    const dates = Object.keys(pending).sort();
    const body = { message: `Check-in ${dates.length === 1 ? dates[0] : dates[0] + " to " + dates[dates.length - 1]}`,
                   content: b64encode(toCsv(merged)), branch: config.github.branch };
    if (remoteSha) body.sha = remoteSha;
    const r = await fetch(apiUrl(), { method: "PUT", headers: { ...apiHeaders(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) {
      // someone (another device) saved first: reload their copy, keep our changes on top, try again
      if (!retry) throw new Error("the file changed on GitHub; reload the page");
      await loadRemote(); saving = false; return save(false);
    }
    if (r.status === 401 || r.status === 403) throw new Error("GitHub refused the key; check it can write to " + config.github.repo);
    if (!r.ok) throw new Error("GitHub said " + r.status);
    remoteSha = (await r.json()).content.sha;
    remote = merged;
    for (const d of Object.keys(pending)) if (JSON.stringify(local[d]) === JSON.stringify(pending[d])) delete local[d];
    writeLocal();
    render(); syncStatus();
  } catch (err) {
    setSync("Not saved: " + err.message + ". Your ticks stay in this browser until it works.", "bad");
  } finally { saving = false; }
}

const dayRecord = n => local[toIso(n)] || remote[toIso(n)] || { done: [] };
const isDone = (name, n) => (dayRecord(n).done || []).includes(name);
function setDay(n, change) {
  const cur = dayRecord(n);
  const rec = { done: [...(cur.done || [])], ...(cur.note ? { note: cur.note } : {}) };
  change(rec);
  if (!rec.note) delete rec.note;
  local[toIso(n)] = rec;
  writeLocal();
  render();
  scheduleSave();
}
const activeOn = (h, n) => n >= h.start && (h.end == null || n <= h.end);

// ---------- stats ----------
// Last day that counts: today only once it's ticked, otherwise yesterday (today is still pending).
const lastCounted = h => Math.min(h.end ?? Infinity, isDone(h.name, TODAY) ? TODAY : TODAY - 1);

// Percentage of the goal met between two days. Each Mon-Sun week asks for
// perWeek days (prorated for partial weeks); extra days in one week can't
// make up for another, so 100% means the goal was met every week.
function periodScore(h, from, to) {
  from = Math.max(from, h.start);
  to = Math.min(to, lastCounted(h));
  if (to < from) return null;
  let credit = 0, expected = 0, done = 0;
  for (let w = monday(from); w <= to; w += 7) {
    let days = 0, d = 0;
    for (let n = Math.max(w, from); n <= Math.min(w + 6, to); n++) { days++; if (isDone(h.name, n)) d++; }
    const t = h.perWeek * days / 7;
    credit += Math.min(d, t); expected += t; done += d;
  }
  return { score: expected ? credit / expected : null, done, days: to - from + 1 };
}

function streaks(h) {
  const stop = Math.min(h.end ?? Infinity, TODAY);
  if (h.perWeek === 7) {
    let cur = 0, n = isDone(h.name, stop) ? stop : stop - 1;
    while (n >= h.start && isDone(h.name, n)) { cur++; n--; }
    let best = 0, run = 0;
    for (n = h.start; n <= stop; n++) { run = isDone(h.name, n) ? run + 1 : 0; best = Math.max(best, run); }
    return { unit: "day", cur, best };
  }
  const weeks = [];
  for (let w = monday(h.start); w <= stop; w += 7) {
    const inRange = [];
    for (let n = Math.max(w, h.start); n <= Math.min(w + 6, h.end ?? Infinity); n++) inRange.push(n);
    if (!inRange.length) continue;
    const target = Math.max(1, Math.round(h.perWeek * inRange.length / 7));
    const done = inRange.filter(n => n <= TODAY && isDone(h.name, n)).length;
    const finished = inRange[inRange.length - 1] < TODAY;
    weeks.push({ target, done, status: done >= target ? "met" : finished ? "missed" : "open", current: w <= TODAY && TODAY <= w + 6 });
  }
  let cur = 0;
  for (let i = weeks.length - 1; i >= 0; i--) {
    if (weeks[i].status === "met") cur++; else if (weeks[i].status === "open") continue; else break;
  }
  let best = 0, run = 0;
  for (const wk of weeks) { if (wk.status === "met") best = Math.max(best, ++run); else if (wk.status === "missed") run = 0; }
  return { unit: "week", cur, best, thisWeek: weeks.find(w => w.current) };
}

function periodsFor(h) {
  const list = [];
  for (const c of challenges) {
    if (c.habits && !c.habits.includes(h.name)) continue;
    if (c.start > TODAY) continue;
    const s = periodScore(h, c.start, c.end);
    if (s) list.push({ label: c.name, active: c.start <= TODAY && TODAY <= c.end, ...s });
  }
  const all = periodScore(h, h.start, Infinity);
  if (all && !list.some(p => p.days === all.days && p.done === all.done)) list.push({ label: "Since " + fmt(h.start, { month: "short", day: "numeric", year: "numeric" }), ...all });
  const last30 = periodScore(h, TODAY - 29, TODAY);
  if (last30 && h.start < TODAY - 29 && (h.end == null || h.end >= TODAY)) list.push({ label: "Last 30 days", ...last30 });
  return list;
}

// ---------- rendering ----------
function showErrors(list) {
  document.getElementById("errors").innerHTML = list.length ? `<div class="banner">${list.map(esc).join("\n")}</div>` : "";
}

function renderChallenges() {
  const el = document.getElementById("challenges");
  const shown = challenges.filter(c => c.end >= TODAY - 60 || c.start <= TODAY);
  if (!shown.length) { el.innerHTML = ""; return; }
  el.innerHTML = "<h2>Challenges</h2>" + shown.map(c => {
    const total = c.end - c.start + 1;
    const members = habits.filter(h => !c.habits || c.habits.includes(h.name));
    if (c.start > TODAY) {
      return `<div class="chal"><div class="chal-top"><span class="chal-name">${esc(c.name)}</span>
        <span class="muted">starts ${fmt(c.start, { month: "short", day: "numeric" })} · in ${c.start - TODAY} days · ${total} days long</span></div></div>`;
    }
    let credit = 0, count = 0;
    for (const h of members) { const s = periodScore(h, c.start, c.end); if (s && s.score != null) { credit += s.score; count++; } }
    const day = Math.min(total, TODAY - c.start + 1);
    const over = TODAY > c.end;
    return `<div class="chal"><div class="chal-top"><span class="chal-name">${esc(c.name)}</span>
      <span><span class="chal-score">${pct(count ? credit / count : null)}</span> <span class="muted">average across ${members.length} habits</span></span></div>
      <div class="pbar"><div class="pfill" style="width:${Math.round(100 * day / total)}%"></div></div>
      <div class="pmeta"><span>${over ? "Finished" : `Day <b>${day}</b> of ${total}`}</span>
      <span>${fmt(c.start, { month: "short", day: "numeric" })} – ${fmt(c.end, { month: "short", day: "numeric", year: "numeric" })}${over ? "" : ` · <b>${c.end - TODAY}</b> days left`}</span></div></div>`;
  }).join("");
}

function renderCheckin() {
  document.getElementById("daylabel").textContent =
    selected === TODAY ? "Today" : selected === TODAY - 1 ? "Yesterday" : fmt(selected, { weekday: "short", month: "short", day: "numeric" });
  document.getElementById("next").disabled = selected >= TODAY;
  document.getElementById("picker").value = toIso(selected);
  document.getElementById("picker").max = toIso(TODAY);
  const active = habits.filter(h => activeOn(h, selected));
  document.getElementById("toggles").innerHTML = active.length ? active.map(h => {
    const on = isDone(h.name, selected);
    return `<button class="toggle${on ? " on" : ""}" style="--c:${esc(h.color)}" data-habit="${esc(h.name)}" aria-pressed="${on}">
      <span class="box">${on ? "✓" : ""}</span>${esc(h.name)}</button>`;
  }).join("") : `<span class="muted">No habits were being tracked on this day.</span>`;
  const note = document.getElementById("note");
  if (document.activeElement !== note) note.value = dayRecord(selected).note || "";
}

function monthCal(h, y, m) {
  const first = Date.UTC(y, m, 1) / MS, last = Date.UTC(y, m + 1, 0) / MS;
  let cells = '<span></span>'.repeat(weekday(first));
  for (let n = first; n <= last; n++) {
    const cls = n > TODAY ? "future" : !activeOn(h, n) ? "out" : isDone(h.name, n) ? "on" : "";
    const sel = n === selected ? " sel" : "";
    const clickable = !cls.match(/future|out/);
    cells += `<button class="mc ${cls}${sel}" title="${fmt(n, { weekday: "short", month: "short", day: "numeric" })}"
      ${clickable ? `data-habit="${esc(h.name)}" data-day="${n}"` : "disabled"}></button>`;
  }
  return `<div class="mcal"><div class="mlabel">${fmt(first, { month: "short" })}</div><div class="mgrid">${cells}</div></div>`;
}

function calendars(h) {
  // up to 4 months, ending at this month (or the habit's end), not before the habit started
  const endN = Math.min(h.end ?? TODAY, TODAY);
  const e = new Date(endN * MS), s = new Date(h.start * MS);
  let y = e.getUTCFullYear(), m = e.getUTCMonth();
  const out = [];
  for (let i = 0; i < 4; i++) {
    if (y < s.getUTCFullYear() || (y === s.getUTCFullYear() && m < s.getUTCMonth())) break;
    out.unshift(monthCal(h, y, m));
    if (--m < 0) { m = 11; y--; }
  }
  return out.join("");
}

function renderHabits() {
  document.getElementById("habits").innerHTML = habits.map(h => {
    const periods = periodsFor(h);
    const head = periods.find(p => p.active) || periods[0];
    const st = streaks(h);
    const ended = h.end != null && h.end < TODAY;
    const notStarted = h.start > TODAY;
    const goal = h.perWeek === 7 ? "daily" : `${h.perWeek}/wk`;
    const thisWeek = st.thisWeek && !ended ? ` · This week <b>${st.thisWeek.done}/${st.thisWeek.target}</b>` : "";
    return `<div class="hrow${ended ? " ended" : ""}" style="--c:${esc(h.color)}">
      <div class="hinfo">
        <div class="hname">${esc(h.name)}${h.star ? '<span class="star">★</span>' : ""}
          <span class="chip first">${goal}</span>${ended ? `<span class="chip">ended ${fmt(h.end, { month: "short", day: "numeric" })}</span>` : ""}</div>
        ${notStarted ? `<div class="streaks">Starts ${fmt(h.start, { month: "short", day: "numeric", year: "numeric" })}</div>` : `
        <div class="hbig">${pct(head && head.score)}<span class="u">${head ? esc(head.label) : "no days yet"}</span></div>
        <div class="periods">${periods.map(p => `<div class="period"><span>${esc(p.label)}</span>
          <span><b>${pct(p.score)}</b> · ${p.done}/${p.days} days</span><span class="bar"><i style="width:${Math.round(100 * (p.score || 0))}%"></i></span></div>`).join("")}</div>
        <div class="streaks">Streak <b>${st.cur} ${st.unit}${st.cur === 1 ? "" : "s"}</b> · Best <b>${st.best}</b>${thisWeek}</div>`}
      </div>
      <div class="hcals">${notStarted ? "" : calendars(h)}</div>
    </div>`;
  }).join("");
}

function render() {
  document.title = config.title;
  document.getElementById("title").textContent = config.title;
  document.getElementById("today").textContent = fmt(TODAY, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  renderChallenges(); renderCheckin(); renderHabits();
}

// ---------- events ----------
function toggle(name, n) {
  setDay(n, rec => { rec.done = rec.done.includes(name) ? rec.done.filter(x => x !== name) : [...rec.done, name]; });
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-habit]");
  if (!t) return;
  const n = t.dataset.day ? Number(t.dataset.day) : selected;
  if (t.dataset.day) selected = n;
  toggle(t.dataset.habit, n);
});
const go = n => { selected = Math.min(TODAY, n); render(); };
document.getElementById("prev").onclick = () => go(selected - 1);
document.getElementById("next").onclick = () => go(selected + 1);
document.getElementById("gotoday").onclick = () => go(TODAY);
document.getElementById("picker").onchange = e => { if (e.target.value) go(toNum(e.target.value)); };
document.getElementById("note").onchange = e => setDay(selected, rec => { rec.note = e.target.value.trim(); });

const box = document.getElementById("connectbox");
document.getElementById("connect").onclick = () => { box.hidden = !box.hidden; };
document.getElementById("savetoken").onclick = async () => {
  const t = document.getElementById("token").value.trim();
  if (!t) return;
  try { localStorage.setItem(TOKEN_KEY, t); } catch { return setSync("This browser won't store the key (private window?).", "bad"); }
  document.getElementById("token").value = ""; box.hidden = true;
  await loadRemote(); render(); scheduleSave(); syncStatus();
};
document.getElementById("forget").onclick = () => { try { localStorage.removeItem(TOKEN_KEY); } catch {} syncStatus(); };

// ---------- start ----------
(async () => {
  let yamlText;
  try {
    const r = await fetch("habits.yaml", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    yamlText = await r.text();
  } catch {
    showErrors([location.protocol === "file:"
      ? "Open this page through its web address (or the VS Code task), not by double-clicking the file: browsers block it from reading habits.yaml."
      : "Could not load habits.yaml next to this page."]);
    return;
  }
  config = loadConfig(yamlText);
  showErrors(config.errors);
  if (!config.habits) return;
  habits = config.habits; challenges = config.challenges;
  if (config.github) {
    document.getElementById("csvpath").textContent = config.github.file;
    document.getElementById("reponame").textContent = config.github.repo;
  } else document.getElementById("connect").hidden = true;
  local = readLocal();
  render();
  await loadRemote().catch(() => {});
  render(); syncStatus();
  if (Object.keys(local).length) scheduleSave();
})();
</script>
</body>
</html>
